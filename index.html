let currentQuestion = 0;
let winningPersona = "";

function startQuiz() {
    document.getElementById("start-container").style.display = "none";
    document.getElementById("quiz-container").style.display = "block";
    loadQuestion();
}

function loadQuestion() {
    const qData = questions[currentQuestion];
    document.getElementById("progress-text").innerText = `Question ${currentQuestion + 1} of ${questions.length}`;
    document.getElementById("question-text").innerText = qData.q;
    
    const choicesContainer = document.getElementById("choices-container");
    choicesContainer.innerHTML = "";

    qData.a.forEach((choice) => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.innerText = choice.t;
        btn.onclick = () => selectAnswer(choice.s);
        choicesContainer.appendChild(btn);
    });
}

function selectAnswer(scoreObject) {
    for (let persona in scoreObject) {
        if (points[persona] !== undefined) {
            points[persona] += scoreObject[persona];
        }
    }

    currentQuestion++;

    if (currentQuestion < questions.length) {
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quiz-container").style.display = "none";
    document.getElementById("result-container").style.display = "block";

    let maxScore = -1;
    let topTies = [];

    for (let persona in points) {
        if (points[persona] > maxScore) {
            maxScore = points[persona];
            topTies = [persona];
        } else if (points[persona] === maxScore) {
            topTies.push(persona);
        }
    }

    const randomIndex = Math.floor(Math.random() * topTies.length);
    winningPersona = topTies[randomIndex];

    const data = resultsData[winningPersona];
    
    document.getElementById("result-image").src = data.image;
    document.getElementById("result-title").innerText = `Your Beardson Alter Ego is: ${winningPersona}`;
    document.getElementById("result-who").innerText = data.who;
    document.getElementById("result-why").innerText = data.why;

    renderHexGraph();
}

function renderHexGraph() {
    const container = document.getElementById("hex-graph-container");
    container.innerHTML = "";

    const orderedPersonas = ["Beardson", "Razorbeard", "Sexson", "Chillson", "Beardlee", "Beardshy"];
    
    const size = 360;
    const center = size / 2;
    const radius = 120;

    const maxVal = Math.max(1, ...Object.values(points));

    const getVertexCoordinates = (r) => {
        let coords = [];
        for (let i = 0; i < 6; i++) {
            const angle = (i * Math.PI) / 3 - Math.PI / 2;
            coords.push({
                x: center + r * Math.cos(angle),
                y: center + r * Math.sin(angle)
            });
        }
        return coords;
    };

    const outerVertices = getVertexCoordinates(radius);

    let svgHTML = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;

    [0.25, 0.5, 0.75, 1].forEach(scale => {
        const polyVerts = getVertexCoordinates(radius * scale);
        const pointsStr = polyVerts.map(v => `${v.x},${v.y}`).join(" ");
        svgHTML += `<polygon points="${pointsStr}" fill="none" stroke="#e0e0e0" stroke-width="1" />`;
    });

    outerVertices.forEach((v, i) => {
        const pName = orderedPersonas[i];
        const color = personaColors[pName];
        svgHTML += `<line x1="${center}" y1="${center}" x2="${v.x}" y2="${v.y}" stroke="${color}" stroke-width="2" opacity="0.6"/>`;
    });

    let userPoints = [];
    orderedPersonas.forEach((pName, i) => {
        const score = points[pName] || 0;
        const scoreRatio = Math.min(1, score / maxVal);
        const angle = (i * Math.PI) / 3 - Math.PI / 2;
        const r = radius * scoreRatio;
        userPoints.push({
            x: center + r * Math.cos(angle),
            y: center + r * Math.sin(angle)
        });
    });

    const userPointsStr = userPoints.map(v => `${v.x},${v.y}`).join(" ");
    svgHTML += `<polygon points="${userPointsStr}" fill="rgba(52, 152, 219, 0.4)" stroke="#2980b9" stroke-width="2" />`;

    userPoints.forEach(v => {
        svgHTML += `<circle cx="${v.x}" cy="${v.y}" r="4" fill="#2c3e50" />`;
    });

    svgHTML += `</svg>`;
    container.innerHTML = svgHTML;

    outerVertices.forEach((v, i) => {
        const pName = orderedPersonas[i];
        const imgPath = resultsData[pName].image;
        const borderColor = personaColors[pName];

        const img = document.createElement("img");
        img.src = imgPath;
        img.className = "hex-corner-avatar";
        img.style.left = `${v.x}px`;
        img.style.top = `${v.y}px`;
        img.style.borderColor = borderColor;
        img.title = `${pName}: ${points[pName]} pts`;
        
        container.appendChild(img);
    });
}

// Helper to load external images securely onto canvas avoiding CORS taint
function loadImg(url) {
    return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = url;
    });
}

async function generateShareCardDataURL() {
    const canvas = document.getElementById("share-canvas");
    const ctx = canvas.getContext("2d");

    // Clear canvas with white background
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 1. Draw Header Text
    ctx.fillStyle = "#2c3e50";
    ctx.font = "bold 32px 'Segoe UI', Tahoma, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(`Your Beardson Alter Ego is: ${winningPersona}`, 40, 65);

    // 2. Draw Result Avatar Image (Left side)
    const resultImgObj = await loadImg(resultsData[winningPersona].image);
    const avatarX = 40;
    const avatarY = 100;
    const avatarSize = 320;

    ctx.save();
    ctx.beginPath();
    ctx.roundRect(avatarX, avatarY, avatarSize, avatarSize, 16);
    ctx.clip();
    if (resultImgObj) {
        ctx.drawImage(resultImgObj, avatarX, avatarY, avatarSize, avatarSize);
    } else {
        ctx.fillStyle = "#ecf0f1";
        ctx.fillRect(avatarX, avatarY, avatarSize, avatarSize);
    }
    ctx.restore();

    // Add border / shadow effect to avatar box
    ctx.strokeStyle = "#dcdde1";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(avatarX, avatarY, avatarSize, avatarSize, 16);
    ctx.stroke();

    // 3. Draw Hex Graph (Right side)
    const graphCenterX = 600;
    const graphCenterY = 260;
    const radius = 110;
    const orderedPersonas = ["Beardson", "Razorbeard", "Sexson", "Chillson", "Beardlee", "Beardshy"];
    const maxVal = Math.max(1, ...Object.values(points));

    const getVerts = (r) => {
        let coords = [];
        for (let i = 0; i < 6; i++) {
            const angle = (i * Math.PI) / 3 - Math.PI / 2;
            coords.push({
                x: graphCenterX + r * Math.cos(angle),
                y: graphCenterY + r * Math.sin(angle)
            });
        }
        return coords;
    };

    // Draw concentric polygon grid lines
    [0.25, 0.5, 0.75, 1].forEach(scale => {
        const polyVerts = getVerts(radius * scale);
        ctx.beginPath();
        polyVerts.forEach((v, idx) => {
            if (idx === 0) ctx.moveTo(v.x, v.y);
            else ctx.lineTo(v.x, v.y);
        });
        ctx.closePath();
        ctx.strokeStyle = "#e0e0e0";
        ctx.lineWidth = 1;
        ctx.stroke();
    });

    // Draw axis lines
    const outerVerts = getVerts(radius);
    outerVerts.forEach((v, i) => {
        const color = personaColors[orderedPersonas[i]];
        ctx.beginPath();
        ctx.moveTo(graphCenterX, graphCenterY);
        ctx.lineTo(v.x, v.y);
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.globalAlpha = 0.6;
        ctx.stroke();
        ctx.globalAlpha = 1.0;
    });

    // Draw user score polygon fill
    let userVerts = [];
    orderedPersonas.forEach((pName, i) => {
        const score = points[pName] || 0;
        const scoreRatio = Math.min(1, score / maxVal);
        const angle = (i * Math.PI) / 3 - Math.PI / 2;
        const r = radius * scoreRatio;
        userVerts.push({
            x: graphCenterX + r * Math.cos(angle),
            y: graphCenterY + r * Math.sin(angle)
        });
    });

    ctx.beginPath();
    userVerts.forEach((v, idx) => {
        if (idx === 0) ctx.moveTo(v.x, v.y);
        else ctx.lineTo(v.x, v.y);
    });
    ctx.closePath();
    ctx.fillStyle = "rgba(52, 152, 219, 0.4)";
    ctx.fill();
    ctx.strokeStyle = "#2980b9";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Draw user vertex dots
    userVerts.forEach(v => {
        ctx.beginPath();
        ctx.arc(v.x, v.y, 4, 0, 2 * Math.PI);
        ctx.fillStyle = "#2c3e50";
        ctx.fill();
    });

    // 4. Draw Corner Avatars around the graph on canvas
    for (let i = 0; i < 6; i++) {
        const pName = orderedPersonas[i];
        const v = outerVerts[i];
        const borderColor = personaColors[pName];
        
        const cornerImg = await loadImg(resultsData[pName].image);
        const iconSize = 36;

        ctx.save();
        ctx.beginPath();
        ctx.arc(v.x, v.y, iconSize / 2, 0, 2 * Math.PI);
        ctx.closePath();
        ctx.clip();

        if (cornerImg) {
            ctx.drawImage(cornerImg, v.x - iconSize/2, v.y - iconSize/2, iconSize, iconSize);
        } else {
            ctx.fillStyle = "#fff";
            ctx.fillRect(v.x - iconSize/2, v.y - iconSize/2, iconSize, iconSize);
        }
        ctx.restore();

        ctx.beginPath();
        ctx.arc(v.x, v.y, iconSize / 2, 0, 2 * Math.PI);
        ctx.strokeStyle = borderColor;
        ctx.lineWidth = 3;
        ctx.stroke();
    }

    return canvas.toDataURL("image/png");
}

async function downloadResultCard() {
    const statusDiv = document.getElementById("share-status");
    statusDiv.innerText = "Generating your image card...";

    try {
        const dataUrl = await generateShareCardDataURL();
        const link = document.createElement('a');
        link.download = 'my-jimboverse-result.png';
        link.href = dataUrl;
        link.click();
        statusDiv.innerText = "Card downloaded successfully! Now click share on X and attach it.";
    } catch (e) {
        console.error(e);
        statusDiv.innerText = "Could not generate image due to security restrictions.";
    }
}

    const statusDiv = document.getElementById("share-status");
    statusDiv.innerText = "Opening X intent...";

    try {
        let cleanUrl = window.location.href;
        if (cleanUrl.startsWith("file:///")) {
            cleanUrl = "https://jimboverse.fandom.com/";
        } else {
            cleanUrl = cleanUrl.split('#')[0];
        }

        let textToShare = `My Beardson Alter Ego is ${winningPersona}! Take the Jimboverse test to find yours:`;
        const twitterUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(textToShare)}&url=${encodeURIComponent(cleanUrl)}`;
        
        window.open(twitterUrl, '_blank');
        statusDiv.innerText = "Remember to attach your downloaded image to your X post!";
    } catch (e) {
        console.error(e);
        statusDiv.innerText = "Could not open Twitter intent.";
    }
}
